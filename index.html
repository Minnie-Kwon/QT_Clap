<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>큐티로봇 짝짝 리듬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2b2f45;
      --pink: #ff8fab;
      --pink-deep: #ff6b8a;
      --blue: #6cb8ff;
      --yellow: #ffd45c;
      --mint: #7fe0c4;
      --card: rgba(255, 255, 255, 0.92);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #aee0fb; color: var(--ink);
      font-family: Jua, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    #scene, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #fx { pointer-events: none; z-index: 1; }
    #play { position: fixed; inset: 0; z-index: 2; touch-action: none; }
    [hidden] { display: none !important; }

    /* ---------- 게임 중 화면 ---------- */
    #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 4; pointer-events: none; padding: 12px 16px; }
    .bar { height: 6px; background: rgba(255, 255, 255, 0.6); border-radius: 99px; overflow: hidden; }
    #progress { height: 100%; width: 0; background: var(--pink); border-radius: 99px; }
    .hudRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .chip { background: var(--card); border-radius: 14px; padding: 6px 12px; font-size: 20px; box-shadow: 0 3px 0 rgba(43, 47, 69, 0.12); }
    .chip small { font-size: 13px; color: #7a7f95; margin-right: 6px; }
    #combo { position: fixed; top: 64px; left: 0; right: 0; text-align: center; font-size: 34px; color: var(--pink-deep);
      text-shadow: 0 3px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff; z-index: 4; pointer-events: none; }
    #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 4;
      pointer-events: none; background: rgba(255, 255, 255, 0.94); border-radius: 16px; padding: 8px 14px; font-size: 18px;
      max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 4px 0 rgba(43, 47, 69, 0.12); }
    .pad.cue { animation: cue 0.5s ease-in-out infinite alternate; opacity: 1; }
    @keyframes cue { from { transform: translateY(0); box-shadow: 0 5px 0 rgba(43, 47, 69, 0.18), 0 0 0 0 rgba(255, 255, 255, 0.9); }
      to { transform: translateY(-6px); box-shadow: 0 9px 0 rgba(43, 47, 69, 0.18), 0 0 0 6px rgba(255, 255, 255, 0.9); } }
    #combo.bump { animation: bump 0.18s ease-out; }
    @keyframes bump { from { transform: scale(1.35); } to { transform: scale(1); } }
    .mood { display: flex; align-items: center; gap: 8px; }
    .moodBar { width: min(140px, 28vw); height: 14px; background: rgba(255, 255, 255, 0.7); border-radius: 99px; overflow: hidden; }
    #moodFill { height: 100%; width: 50%; background: linear-gradient(90deg, var(--pink), var(--yellow)); transition: width 0.2s; }
    #quit { pointer-events: auto; font: inherit; font-size: 15px; border: 0; background: var(--card); color: var(--ink);
      border-radius: 12px; padding: 6px 10px; cursor: pointer; box-shadow: 0 3px 0 rgba(43, 47, 69, 0.12); }

    #pads { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; display: grid;
      grid-template-columns: 36fr 28fr 36fr; gap: 10px; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
    .pad { height: 74px; border-radius: 20px; display: grid; place-items: center; font-size: 20px; color: #fff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); box-shadow: 0 5px 0 rgba(43, 47, 69, 0.18); opacity: 0.88; }
    .pad kbd { font: inherit; font-size: 12px; opacity: 0.85; display: block; text-align: center; }
    #padL { background: var(--pink); }
    #padB { background: var(--yellow); color: var(--ink); text-shadow: none; }
    #padR { background: var(--blue); }
    .pad.hit { animation: press 0.15s ease-out; }
    @keyframes press { from { transform: translateY(4px) scale(0.96); filter: brightness(1.15); } to { transform: none; } }

    /* ---------- 시작 / 결과 화면 ---------- */
    .overlay { position: fixed; inset: 0; z-index: 5; display: flex; padding: 16px; overflow-y: auto;
      background: linear-gradient(180deg, rgba(174, 224, 251, 0.15), rgba(255, 233, 199, 0.35)); }
    .panel { width: min(520px, 100%); margin: auto; background: var(--card); border-radius: 28px; padding: 18px 20px;
      box-shadow: 0 8px 0 rgba(43, 47, 69, 0.12); text-align: center; }
    .logo { margin: 0; font-size: clamp(30px, 8vw, 44px); line-height: 1.05; color: var(--pink-deep); }
    .logo span { color: var(--blue); }
    .sub { margin: 6px 0 12px; color: #6b7088; font-size: 16px; }
    #levels { display: grid; gap: 8px; }
    #levels.loading { opacity: 0.4; pointer-events: none; }
    .lv { font: inherit; border: 0; border-radius: 18px; padding: 10px 16px; cursor: pointer; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; font-size: 22px; color: var(--ink); box-shadow: 0 5px 0 rgba(43, 47, 69, 0.15); }
    .lv:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43, 47, 69, 0.15); }
    .lv small { font-size: 14px; color: rgba(43, 47, 69, 0.7); display: block; text-align: left; }
    .lv .best { font-size: 14px; color: rgba(43, 47, 69, 0.75); }
    .lv.practice { background: #ffffff; border: 3px dashed var(--mint); }
    .lv .tag { font-size: 14px; background: var(--mint); border-radius: 999px; padding: 3px 10px; }
    .lv.easy { background: var(--mint); }
    .lv.normal { background: var(--yellow); }
    .lv.veryeasy { background: #c9f2e3; }
    .how { margin-top: 10px; text-align: left; font-size: 14px; line-height: 1.6; color: #4a4f66; background: #fff6e8; border-radius: 16px; padding: 12px 14px; }
    .how b { color: var(--pink-deep); font-weight: normal; }
    .offset { margin-top: 8px; font-size: 14px; color: #6b7088; display: flex; align-items: center; gap: 8px; justify-content: center; }
    .offset input { width: 140px; }
    #loadMsg { margin: 10px 0 0; font-size: 14px; color: #c0506b; min-height: 1em; }

    #rStars { font-size: 52px; color: #ffbf1f; letter-spacing: 6px; text-shadow: 0 3px 0 rgba(43, 47, 69, 0.12); }
    #rTitle { margin: 4px 0 6px; font-size: 26px; }
    #rScore { font-size: 40px; color: var(--pink-deep); }
    #rDetail { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 18px; }
    #rDetail span { background: #f3f4fa; border-radius: 10px; padding: 4px 10px; font-size: 15px; }
    #rDetail .p { color: var(--pink-deep); } #rDetail .g { color: #3d9bff; } #rDetail .m { color: #8a8f9c; }
    .btns { display: flex; gap: 10px; justify-content: center; }
    .btns button { font: inherit; font-size: 20px; border: 0; border-radius: 16px; padding: 12px 18px; cursor: pointer; box-shadow: 0 5px 0 rgba(43, 47, 69, 0.15); }
    #retry { background: var(--pink); color: #fff; }
    #toTitle { background: #eef0f7; color: var(--ink); }

  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="fx"></canvas>
  <div id="play"></div>

  <div id="hud" hidden>
    <div class="bar"><div id="progress"></div></div>
    <div class="hudRow">
      <div class="chip"><small>점수</small><span id="score">0</span></div>
      <div class="chip mood"><small>큐티 기분</small><div class="moodBar"><div id="moodFill"></div></div></div>
      <button id="quit">그만</button>
    </div>
  </div>
  <div id="combo"></div>
  <div id="caption" hidden></div>

  <div id="pads" hidden>
    <div class="pad" id="padL"><div>왼손<kbd>← / F</kbd></div></div>
    <div class="pad" id="padB"><div>양손<kbd>Space</kbd></div></div>
    <div class="pad" id="padR"><div>오른손<kbd>→ / J</kbd></div></div>
  </div>

  <div class="overlay" id="title">
    <div class="panel">
      <h1 class="logo">큐티로봇<br /><span>짝짝 리듬</span></h1>
      <p class="sub">음악에 맞춰 큐티와 박수를 쳐요!</p>
      <div id="levels">
        <button class="lv practice" data-level="practice"><span>연습하기<small>반짝반짝 작은별 · 천천히 배워요 · 판정 넉넉</small></span><span class="tag">처음이면 여기!</span></button>
        <button class="lv veryeasy" data-level="veryeasy"><span>아주 쉬움<small>비행기 · 한 마디에 한두 번 · 판정 넉넉</small></span><span class="best"></span></button>
        <button class="lv easy" data-level="easy"><span>쉬움<small>나비야 · 정박 박수</small></span><span class="best"></span></button>
        <button class="lv normal" data-level="normal"><span>보통<small>런던 다리 · 엇박 등장</small></span><span class="best"></span></button>
      </div>
      <p id="loadMsg"></p>
      <div class="how">
        큐티가 손을 내밀면 <b>링이 줄어들어요</b>. 링이 손바닥에 딱 닿는 순간 터치!<br />
        화면 <b>왼쪽</b> = 왼손, <b>오른쪽</b> = 오른손, <b>가운데</b>(또는 두 손가락) = 양손<br />
        큐티가 혼자 박수 칠 때는 쉬어요. 키보드는 ← Space →
      </div>
      <label class="offset">타이밍 조절 <input id="offset" type="range" min="-150" max="150" step="10" value="0" /> <span id="offsetVal">0ms</span></label>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="panel">
      <div id="rStars">☆☆☆</div>
      <h2 id="rTitle"></h2>
      <div id="rScore">0</div>
      <div id="rDetail"></div>
      <div class="btns"><button id="retry">다시 하기</button><button id="toTitle">처음으로</button></div>
    </div>
  </div>

  <!-- 문제 진단: 게임이 안 열리면 원인을 시작 화면에 표시 -->
  <script>
    (function () {
      var msg = document.getElementById('loadMsg');
      function show(t) { msg.textContent = t; }
      if (location.protocol === 'file:') {
        show('index.html을 더블클릭해서 열면 작동하지 않아요. start.bat을 더블클릭해서 열어 주세요.');
        document.getElementById('levels').classList.add('loading');
        return;
      }
      window.addEventListener('error', function (e) { show('오류: ' + (e.message || e.filename)); });
      window.addEventListener('unhandledrejection', function (e) { show('오류: ' + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () {
        if (!window.__gameStarted) {
          show('게임 코드를 불러오지 못했어요. 인터넷 연결을 확인하고 F12 → Console의 빨간 글씨를 알려 주세요.');
          document.getElementById('levels').classList.add('loading');
        }
      }, 10000);
    })();
  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
